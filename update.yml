---
- hosts: all
  gather_facts: yes
  tasks:
    - name: Update packages on Debian/Ubuntu
      apt:
        update_cache: yes
        upgrade: dist
      register: apt_result
      when: ansible_os_family == "Debian"

    - name: Update packages on RedHat/CentOS
      yum:
        name: '*'
        state: latest
      register: yum_result
      when: ansible_os_family == "RedHat"

    - name: Install updates on Windows
      win_updates:
        category_names:
          - SecurityUpdates
          - CriticalUpdates
        reboot: yes
      when: ansible_os_family == "Windows"

    - name: Reboot the machine if required
      reboot:
        msg: "Rebooting machine after updates"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: whoami
      when: ansible_os_family != "Windows" and (apt_result is changed or yum_result is changed)
